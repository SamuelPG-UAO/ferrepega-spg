<text x="1707.5" y="513.4" text-anchor="middle" font-size="13" font-weight="normal" fill="#16181D">sistema» (provisioning)</text>
<rect x="1325" y="560" width="505" height="95" rx="14" fill="#EADFF5" stroke="#6B3FA0" stroke-width="2"/>
<text x="1577.5" y="594.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#16181D">node-exporter (1 por nodo, modo global)</text>
<text x="1577.5" y="611.3" text-anchor="middle" font-size="13" font-weight="normal" fill="#16181D">CPU y memoria de cada VM  ·  /metrics en cada servicio:</text>
<text x="1577.5" y="628.4" text-anchor="middle" font-size="13" font-weight="normal" fill="#16181D">peticiones/s, errores 4xx/5xx, latencia p95, réplicas vivas</text>
<rect x="1310" y="700" width="535" height="255" rx="14" fill="#FBE3D0" stroke="#C4621A" stroke-width="2"/>
<text x="1332" y="724.6" text-anchor="start" font-size="16" font-weight="bold" fill="#16181D">PROCESAMIENTO PARALELO  ·  Apache Spark (modo clúster)</text>
<rect x="1325" y="745" width="505" height="80" rx="14" fill="#FBE3D0" stroke="#C4621A" stroke-width="2"/>
<text x="1577.5" y="771.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#16181D">spark-master (UI :8080) · job_ventas.py</text>
<text x="1577.5" y="788.8" text-anchor="middle" font-size="13" font-weight="normal" fill="#16181D">lee ventas por API (JWT) → map · shuffle · reduce</text>
<text x="1577.5" y="805.9" text-anchor="middle" font-size="13" font-weight="normal" fill="#16181D">→ escribe resúmenes en analitica_db</text>
<rect x="1325" y="845" width="245" height="95" rx="14" fill="#FBE3D0" stroke="#C4621A" stroke-width="2"/>
<text x="1447.5" y="879.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#16181D">spark-worker 1</text>
<text x="1447.5" y="896.3" text-anchor="middle" font-size="13" font-weight="normal" fill="#16181D">1 core · 768 MB</text>
<text x="1447.5" y="913.4" text-anchor="middle" font-size="13" font-weight="normal" fill="#16181D">(ejecuta tareas)</text>
<rect x="1585" y="845" width="245" height="95" rx="14" fill="#FBE3D0" stroke="#C4621A" stroke-width="2"/>
<text x="1707.5" y="879.1" text-anchor="middle" font-size="13" font-weight="bold" fill="#16181D">spark-worker 2</text>
<text x="1707.5" y="896.3" text-anchor="middle" font-size="13" font-weight="normal" fill="#16181D">1 core · 768 MB</text>
<text x="1707.5" y="913.4" text-anchor="middle" font-size="13" font-weight="normal" fill="#16181D">(ejecuta tareas)</text>
<rect x="60" y="880" width="215" height="80" rx="8" fill="#EEEEEE" stroke="#6A6A6A" stroke-width="2"/>
<text x="167.5" y="906.6" text-anchor="middle" font-size="13" font-weight="bold" fill="#16181D">registro (registry:2)</text>
<text x="167.5" y="923.8" text-anchor="middle" font-size="13" font-weight="normal" fill="#16181D">imágenes para los 2 nodos</text>
<text x="167.5" y="940.9" text-anchor="middle" font-size="13" font-weight="normal" fill="#16181D">127.0.0.1:5000</text>
<rect x="300" y="850" width="970" height="110" rx="14" fill="#FFF1F0" stroke="#C0392B" stroke-width="2" stroke-dasharray="8 5"/>
<text x="320" y="872.1" text-anchor="start" font-size="14" font-weight="bold" fill="#16181D">ALTA DISPONIBILIDAD · ESCALABILIDAD · TOLERANCIA A FALLOS</text>
<text x="320" y="897.0" text-anchor="start" font-size="13" font-weight="normal" fill="#16181D">• 2 réplicas de cada servicio, repartidas entre los 2 nodos (docker service scale para más)</text>
<text x="320" y="914.2" text-anchor="start" font-size="13" font-weight="normal" fill="#16181D">• healthcheck /salud: Swarm reemplaza lo no sano · restart_policy any · rolling update start-first (sin caída)</text>
<text x="320" y="931.3" text-anchor="start" font-size="13" font-weight="normal" fill="#16181D">• si cae un nodo, las réplicas se reprograman en el otro · routing mesh: :80 responde en cualquier IP</text>
<text x="320" y="948.5" text-anchor="start" font-size="13" font-weight="normal" fill="#16181D">• Limitación: PostgreSQL y el manager son únicos (se mitiga con volumen y se documenta)</text>
<rect x="30" y="1000" width="1840" height="100" rx="14" fill="#F3F4F6" stroke="#8A8F98" stroke-width="2"/>
<rect x="48" y="1010" width="900" height="82" rx="14" fill="#F3F4F6" stroke="#8A8F98" stroke-width="2"/>
<text x="56" y="1037.6" text-anchor="start" font-size="13" font-weight="bold" fill="#16181D">NODO MANAGER · VM back · 192.168.56.10 · 4 GB</text>
<text x="56" y="1054.8" text-anchor="start" font-size="13" font-weight="normal" fill="#16181D">edge, front, 4 servicios (1 réplica c/u), db, registro, prometheus, grafana,</text>
<text x="56" y="1071.9" text-anchor="start" font-size="13" font-weight="normal" fill="#16181D">spark-master, spark-worker, node-exporter</text>
<rect x="962" y="1010" width="890" height="82" rx="14" fill="#F3F4F6" stroke="#8A8F98" stroke-width="2"/>
<text x="970" y="1037.6" text-anchor="start" font-size="13" font-weight="bold" fill="#16181D">NODO WORKER · VM front · 192.168.56.11 · 3,5 GB</text>
<text x="970" y="1054.8" text-anchor="start" font-size="13" font-weight="normal" fill="#16181D">edge, front, 4 servicios (1 réplica c/u), spark-worker, node-exporter</text>
<text x="970" y="1071.9" text-anchor="start" font-size="13" font-weight="normal" fill="#16181D">(Vagrant + VirtualBox · Ubuntu 22.04 · Docker Engine)</text>
<text x="48" y="1133.0" text-anchor="start" font-size="13" font-weight="normal" fill="#16181D">LEYENDA   ━━▶ comunicación SÍNCRONA (HTTP/REST con token JWT)   ┅┅▶ comunicación ASÍNCRONA / por lotes (Spark, scrape de métricas)   ▭ contenedor (xN = réplicas)   ⛁ base de datos</text>
<text x="48" y="1150.2" text-anchor="start" font-size="13" font-weight="normal" fill="#16181D">PATRONES  API Gateway (edge) · Database per service · CQRS y separación de responsabilidades (ventas escribe, analitica mantiene el modelo de lectura) · Procesamiento por lotes (Spark → modelo de lectura)</text>
<text x="48" y="1167.3" text-anchor="start" font-size="13" font-weight="normal" fill="#16181D">Event-Driven: no implementado; el siguiente paso sería que ventas publique «venta registrada» en un broker y analitica la consuma (hoy analitica se recalcula bajo demanda o con el job de Spark).</text>
