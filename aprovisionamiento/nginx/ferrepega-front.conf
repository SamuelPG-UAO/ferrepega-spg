# =========================================================
# Ferrepega - Nginx del FRONT
#
#   http://ferrepega.test/          -> gunicorn (Flask) en 127.0.0.1:8000
#   http://ferrepega.test/static/*  -> archivos servidos directo por Nginx
#
# Nginx atiende el puerto 80 (lo único expuesto de la VM) y reenvía a gunicorn,
# que solo escucha en localhost. Va en /etc/nginx/conf.d/ (lo instala front.sh).
# =========================================================

# Freno contra fuerza bruta en el formulario de acceso: 5 peticiones por segundo por IP
limit_req_zone $binary_remote_addr zone=ferrepega_login:10m rate=5r/s;
limit_req_status 429;

upstream ferrepega_flask {
    server 127.0.0.1:8000;
}

server {
    listen 80 default_server;
    server_name ferrepega.test www.ferrepega.test _;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Archivos estáticos (CSS, JS, fuentes): los sirve Nginx sin molestar a Flask
    location /static/ {
        alias /vagrant/frontend/app/static/;
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /login {
        limit_req zone=ferrepega_login burst=10 nodelay;
        include /etc/nginx/ferrepega-proxy.inc;
    }
    location = /registro {
        limit_req zone=ferrepega_login burst=10 nodelay;
        include /etc/nginx/ferrepega-proxy.inc;
    }

    location / {
        include /etc/nginx/ferrepega-proxy.inc;
    }
}
