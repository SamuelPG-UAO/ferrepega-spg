# =========================================================
# Ferrepega - API Gateway (Nginx)
#
# Es la ÚNICA puerta de entrada al back: los clientes llaman a
#     http://<servidor>/api/<servicio>/...
# y Nginx reenvía cada petición al microservicio que corresponde,
# que escucha solo en localhost (127.0.0.1) y no es accesible desde fuera.
#
#   /api/auth/*        -> servicio-autenticacion  (127.0.0.1:8001)
#   /api/inventario/*  -> servicio-inventario     (127.0.0.1:8002)
#   /api/ventas/*      -> servicio-ventas         (127.0.0.1:8003)
#   /api/analitica/*   -> servicio-analitica      (127.0.0.1:8004)
#
# Los servicios ya usan esos mismos prefijos en sus rutas, así que Nginx
# reenvía la dirección tal cual, sin reescribirla.
# Este archivo va en /etc/nginx/conf.d/ (lo instala gateway.sh).
# =========================================================

# Freno contra fuerza bruta: máximo 10 intentos por segundo por IP en login/registro
# (con una ráfaga de 20). Una persona real jamás llega a eso.
limit_req_zone $binary_remote_addr zone=ferrepega_acceso:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80 default_server;
    server_name _;            # responde por IP y por cualquier nombre de dominio

    server_tokens off;        # no revela la versión de Nginx
    client_max_body_size 1m;  # ninguna petición de esta API necesita más
    default_type application/json;

    add_header X-Content-Type-Options "nosniff" always;

    # Datos que los servicios pueden necesitar saber del cliente original
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    # Errores generados por Nginx (no por los servicios) también en JSON.
    # Los errores que devuelve un servicio pasan sin tocarse.
    error_page 429 = @demasiadas_peticiones;
    error_page 502 503 504 = @servicio_no_disponible;
    error_page 413 = @cuerpo_muy_grande;

    # --- Estado del gateway -------------------------------------------
    location = / {
        return 200 '{"servicio":"Ferrepega API Gateway","estado":"ok"}';
    }
    location = /api/salud {
        return 200 '{"servicio":"gateway","estado":"ok"}';
    }

    # --- Login y registro: con freno anti fuerza bruta -----------------
    location ~ ^/api/auth/(login|registro)$ {
        limit_req zone=ferrepega_acceso burst=20 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }

    # --- Microservicios ------------------------------------------------
    # Cada servicio tiene dos reglas: "/api/x/" (todo lo que cuelga de él) y
    # "= /api/x" (la ruta exacta SIN barra final, p. ej. GET /api/ventas).
    # Sin la segunda, Nginx redirige "/api/ventas" a "/api/ventas/", FastAPI lo
    # devuelve a "/api/ventas" y el cliente queda en un bucle de redirecciones.
    location /api/auth/       { proxy_pass http://127.0.0.1:8001; }
    location = /api/auth      { proxy_pass http://127.0.0.1:8001; }

    location /api/inventario/ { proxy_pass http://127.0.0.1:8002; }
    location = /api/inventario { proxy_pass http://127.0.0.1:8002; }

    location /api/ventas/     { proxy_pass http://127.0.0.1:8003; }
    location = /api/ventas    { proxy_pass http://127.0.0.1:8003; }

    location /api/analitica/  {
        proxy_read_timeout 120s;   # recalcular los resúmenes puede tardar
        proxy_pass http://127.0.0.1:8004;
    }
    location = /api/analitica { proxy_pass http://127.0.0.1:8004; }

    # --- Todo lo demás --------------------------------------------------
    location / {
        return 404 '{"detail":"Ruta no encontrada"}';
    }

    # --- Respuestas de error en JSON -----------------------------------
    location @servicio_no_disponible {
        return 503 '{"detail":"Servicio no disponible; intenta de nuevo en unos segundos"}';
    }
    location @demasiadas_peticiones {
        return 429 '{"detail":"Demasiadas peticiones; espera un momento"}';
    }
    location @cuerpo_muy_grande {
        return 413 '{"detail":"La petición es demasiado grande"}';
    }
}
