# =========================================================
# Ferrepega - Proxy de entrada ("edge") en Docker Swarm
#
# Un solo Nginx, publicado en el puerto 80 de TODOS los nodos del Swarm
# (la "routing mesh" de Swarm lo hace alcanzable desde cualquier IP), que
# cumple dos papeles según el nombre de dominio:
#
#   api.ferrepega.test   -> API GATEWAY: reparte /api/<servicio>/ a los microservicios
#   ferrepega.test       -> el FRONT (Flask)
#
# Es el equivalente a los dos Nginx que había en las VM (ferrepega-gateway.conf
# y ferrepega-front.conf), unidos. Cualquier otro nombre (por IP, o desde el
# propio Swarm como http://edge) cae en el bloque del gateway.
#
# Los nombres "autenticacion", "inventario"... son los de los servicios de
# Swarm: su DNS interno (127.0.0.11) devuelve una IP virtual que reparte las
# peticiones entre las réplicas. Como usamos "resolver" + variables, Nginx
# vuelve a resolverlos cada pocos segundos: si una réplica o un servicio
# cambia de nodo, el gateway lo sigue sin reiniciarse.
# =========================================================

resolver 127.0.0.11 valid=5s ipv6=off;

# Freno contra fuerza bruta (igual que antes)
limit_req_zone $binary_remote_addr zone=ferrepega_acceso:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ferrepega_login:10m rate=5r/s;
limit_req_status 429;

# ---------------------------------------------------------
# API GATEWAY
# ---------------------------------------------------------
server {
    listen 80 default_server;
    server_name api.ferrepega.test _;

    server_tokens off;
    client_max_body_size 1m;
    default_type application/json;

    add_header X-Content-Type-Options "nosniff" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    # Si una réplica falla a media petición, Nginx prueba otra vez con la
    # siguiente (solo para peticiones que no modifican datos).
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    error_page 429 = @demasiadas_peticiones;
    error_page 502 503 504 = @servicio_no_disponible;
    error_page 413 = @cuerpo_muy_grande;

    location = / {
        return 200 '{"servicio":"Ferrepega API Gateway","estado":"ok"}';
    }
    location = /api/salud {
        return 200 '{"servicio":"gateway","estado":"ok"}';
    }

    # Login y registro: con freno anti fuerza bruta
    location ~ ^/api/auth/(login|registro)$ {
        limit_req zone=ferrepega_acceso burst=20 nodelay;
        set $destino http://autenticacion:8001;
        proxy_pass $destino;
    }

    # Cada microservicio: "/api/x/" (todo lo que cuelga de él) y "= /api/x" (sin barra final).
    # Con proxy_pass + variable y sin ruta, Nginx reenvía la dirección tal cual.
    location /api/auth/       { set $destino http://autenticacion:8001; proxy_pass $destino; }
    location = /api/auth      { set $destino http://autenticacion:8001; proxy_pass $destino; }

    location /api/inventario/ { set $destino http://inventario:8002; proxy_pass $destino; }
    location = /api/inventario { set $destino http://inventario:8002; proxy_pass $destino; }

    location /api/ventas/     { set $destino http://ventas:8003; proxy_pass $destino; }
    location = /api/ventas    { set $destino http://ventas:8003; proxy_pass $destino; }

    location /api/analitica/  {
        proxy_read_timeout 120s;   # recalcular los resúmenes puede tardar
        set $destino http://analitica:8004;
        proxy_pass $destino;
    }
    location = /api/analitica { set $destino http://analitica:8004; proxy_pass $destino; }

    # /metrics y cualquier otra ruta NO se exponen hacia afuera
    location / {
        return 404 '{"detail":"Ruta no encontrada"}';
    }

    location @servicio_no_disponible {
        return 503 '{"detail":"Servicio no disponible; intenta de nuevo en unos segundos"}';
    }
    location @demasiadas_peticiones {
        return 429 '{"detail":"Demasiadas peticiones; espera un momento"}';
    }
    location @cuerpo_muy_grande {
        return 413 '{"detail":"La petición es demasiado grande"}';
    }
}

# ---------------------------------------------------------
# FRONT (Flask + gunicorn)
# ---------------------------------------------------------
server {
    listen 80;
    server_name ferrepega.test www.ferrepega.test;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    # Archivos estáticos: los sirve Nginx (copiados dentro de esta imagen)
    location /static/ {
        alias /usr/share/ferrepega/static/;
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    # Las métricas del front son solo para Prometheus, dentro de la red de Docker
    location = /metrics { return 404; }

    location = /login {
        limit_req zone=ferrepega_login burst=10 nodelay;
        set $destino http://front:8000;
        proxy_pass $destino;
    }
    location = /registro {
        limit_req zone=ferrepega_login burst=10 nodelay;
        set $destino http://front:8000;
        proxy_pass $destino;
    }

    location / {
        set $destino http://front:8000;
        proxy_pass $destino;
    }
}
