{% if usuario %}{% extends "base.html" %}{% else %}{% extends "base_publica.html" %}{% endif %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="error-pagina">

</div>
{% endblock %}
